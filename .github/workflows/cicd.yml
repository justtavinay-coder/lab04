name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Release
            executable_suffix: ""
          - name: Linux clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Release
            executable_suffix: ""
          - name: Windows MSVC
            os: windows-latest
            build_type: Release
            executable_suffix: ".exe"

    steps:
      - uses: actions/checkout@v6

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B _build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B _build

      - name: Build
        run: cmake --build _build --config ${{ matrix.build_type }}

      - name: Run examples
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            HELLO="./_build/hello_world_application/${{ matrix.build_type }}/hello_world${{ matrix.executable_suffix }}"
            SOLVER="./_build/solver_application/${{ matrix.build_type }}/solver${{ matrix.executable_suffix }}"
          else
            HELLO="./_build/hello_world_application/hello_world${{ matrix.executable_suffix }}"
            SOLVER="./_build/solver_application/solver${{ matrix.executable_suffix }}"
          fi

          "${HELLO}"
          printf "1 0 -1\n" | "${SOLVER}"
