name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux ${{ matrix.compiler }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B _build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Build
        run: cmake --build _build

      - name: Run hello_world
        run: ./_build/hello_world_application/hello_world

      - name: Run solver
        run: printf "1 0 -1\n" | ./_build/solver_application/solver

  windows:
    name: Windows MSVC
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B _build

      - name: Build
        run: cmake --build _build --config Release

      - name: Run hello_world
        run: .\_build\hello_world_application\Release\hello_world.exe

      - name: Run solver
        shell: cmd
        run: echo 1 0 -1 | .\_build\solver_application\Release\solver.exe
